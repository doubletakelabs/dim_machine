<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>DIM Custom Page Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0b0b10; color: #e8e8f0;
      display: flex; flex-direction: column;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #stage { flex: 1; position: relative; overflow: hidden; }
    #page { position: absolute; inset: 0; }
    #banner {
      padding: 10px 14px; font-size: 12px; color: #8888a0;
      background: #12121a; border-bottom: 1px solid #1d1d28;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    #banner b { color: #e8e8f0; }
    #banner a { color: #6c5ce7; }
    .page-center {
      height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; padding: 28px; text-align: center;
    }
    .page-title { font-size: 32px; font-weight: 700; line-height: 1.2; }
    .page-body { font-size: 18px; color: #b8b8cc; line-height: 1.5; max-width: 34ch; }
    .page-btn {
      font-size: 18px; padding: 16px 32px; border-radius: 14px; border: 1px solid #34345a;
      background: #1c1c30; color: #e8e8f0; min-width: 220px;
    }
    .page-btn:active { background: #6c5ce7; }
  </style>
</head>
<body>
  <div id="banner">
    <span>Preview · <b id="who"></b></span>
    <span>page: <b id="pageName">–</b></span>
    <span>Open a second tab with <a id="secondLink" href="#">?u=2</a> to test relay</span>
  </div>
  <div id="stage"><div id="page"></div></div>
  <script src="page-loader.js"></script>
  <script src="preview-mock.js"></script>
  <script src="pages.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const page = params.get('page') ?? 'cursorArena';
      let props = {};
      try { props = JSON.parse(params.get('props') ?? '{}'); } catch {}
      const u = params.get('u') ?? '1';

      document.getElementById('who').textContent = DIM.self.label;
      document.getElementById('pageName').textContent = page;
      const link = document.getElementById('secondLink');
      link.href = `?page=${encodeURIComponent(page)}&u=${u === '1' ? '2' : '1'}&props=${encodeURIComponent(JSON.stringify(props))}`;

      await DIM_PAGES.render(document.getElementById('page'), page, props);
    })();
  </script>
</body>
</html>
