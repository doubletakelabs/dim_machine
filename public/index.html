<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>DIM Machine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0b0b10; color: #e8e8f0;
      display: flex; flex-direction: column;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #stage { flex: 1; position: relative; overflow: hidden; }
    #joinScreen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; z-index: 5;
      background: #0b0b10; text-align: center; padding: 24px;
    }
    #join {
      font-size: 22px; padding: 20px 48px; border-radius: 999px; border: none;
      background: #6c5ce7; color: white; font-weight: 600;
    }
    #join:disabled { opacity: 0.5; }
    #page { position: absolute; inset: 0; }

    .page-center {
      height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; padding: 28px; text-align: center;
    }
    .page-title { font-size: 32px; font-weight: 700; line-height: 1.2; }
    .page-sub, .page-body { font-size: 18px; color: #b8b8cc; line-height: 1.5; max-width: 34ch; }
    .page-hint { font-size: 13px; color: #666680; letter-spacing: 0.06em; text-transform: uppercase; }
    .page-btn {
      font-size: 18px; padding: 16px 32px; border-radius: 14px; border: 1px solid #34345a;
      background: #1c1c30; color: #e8e8f0; min-width: 220px;
    }
    .page-btn:active { background: #6c5ce7; }
    .choices { display: flex; flex-direction: column; gap: 12px; }
    .tappable { cursor: pointer; }
    .pulse {
      width: 64px; height: 64px; border-radius: 50%;
      background: radial-gradient(circle, #6c5ce7 0%, #3a2f80 70%);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .pulse.playing { animation-duration: 1.2s; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.25); opacity: 1; } }
    .gesture-area {
      position: absolute; inset: 0; display: flex; align-items: flex-end;
      justify-content: center; padding-bottom: 40px; touch-action: none;
      background: radial-gradient(ellipse at center, #14141f 0%, #0b0b10 75%);
    }
    .gesture-dot {
      position: absolute; width: 44px; height: 44px; border-radius: 50%;
      background: #6c5ce766; border: 2px solid #6c5ce7;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #videoOverlay {
      position: fixed; inset: 0; background: black; z-index: 8; display: none;
      align-items: center; justify-content: center;
    }
    #videoOverlay video { width: 100%; height: 100%; object-fit: contain; }
    /*
      Sits above the page and below video and flash. The artwork is full-bleed
      black to the edges, so `cover` rather than `contain`: a letterbox would put
      the page's own background either side of a black card and read as a bug.
    */
    #imageOverlay {
      position: fixed; inset: 0; background: black; z-index: 7; display: none;
    }
    #imageOverlay img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 20; }
    #status {
      padding: 8px 12px; font-size: 11px; color: #8888a0;
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      border-top: 1px solid #1d1d28; font-variant-numeric: tabular-nums;
      /* Above the screen overlay, which is full-bleed by design. `z-index` on a
         static element does nothing, which is why this needs `position`. */
      position: relative; z-index: 10; background: rgba(11, 11, 16, 0.88);
    }
    /* ---------------------------------------------------------------- companion
       The phone's own screen (companion.js; visual_refs/DIM-APP-SPEC.md).
       Over the page, under the join screen (5) and the image/video overlays. */
    @font-face { font-family: 'Raleway'; font-weight: 100 900; font-display: block;
      src: url(assets/fonts/raleway-latin.woff2) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; font-display: block;
      src: url(assets/fonts/jetbrains-mono-latin.woff2) format('woff2'); }
    #companion {
      position: absolute; inset: 0; z-index: 4; overflow: hidden;
      background: #000; color: #fff; font-family: 'Raleway', sans-serif;
      transition: background-color .3s ease, color .3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hanging by the lanyard, top down: the whole page turned, so the people
       in front read it right way up. */
    html.cmp-hanging body { transform: rotate(180deg); }
    body { transition: opacity .18s ease; }
    html.cmp-turning body { opacity: 0; }
    .cmp-view {
      position: absolute; inset: 0; padding: 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; opacity: 0; pointer-events: none; transition: opacity .35s ease;
    }
    .cmp-view.active { opacity: 1; pointer-events: auto; }
    .cmp-big {
      font-weight: 900; text-transform: uppercase; line-height: .86; letter-spacing: -.01em;
      width: 100%; overflow-wrap: anywhere; text-wrap: balance;
    }
    .cmp-mark { font-size: 25.65vw; animation: cmp-pulse 1.8s ease-in-out infinite; }
    .cmp-idle-word { font-size: 16vw; animation: cmp-breathe 3.6s ease-in-out infinite; transition: opacity .3s ease; }
    .cmp-word-text { font-size: 17vw; animation: cmp-word-in .35s cubic-bezier(.2, .9, .3, 1); }
    .cmp-close-mark { font-size: 13vw; }
    .cmp-close-sub {
      margin-top: 20px; font-size: 12px; font-weight: 500; letter-spacing: .1em; line-height: 1.7;
      text-transform: uppercase; opacity: .6; max-width: 80%;
    }
    .cmp-spinner {
      margin-top: 28px; width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid color-mix(in srgb, currentColor 20%, transparent); border-top-color: currentColor;
      animation: cmp-spin 1s linear infinite;
    }
    @keyframes cmp-pulse { 0%, 100% { opacity: .18; } 50% { opacity: 1; } }
    @keyframes cmp-breathe { 0%, 100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes cmp-word-in { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes cmp-spin { to { transform: rotate(360deg); } }

    .cmp-help { background: #000; color: #fff; align-items: stretch; justify-content: flex-start; text-align: left; padding: 0; }
    .cmp-help-inner { padding: calc(env(safe-area-inset-top, 0px) + 150px) 26px 32px 26px; overflow-y: auto; height: 100%; padding-right: 74px; }
    .cmp-help h2 { font-weight: 900; text-transform: uppercase; font-size: 28px; margin: 0 0 22px; }
    .cmp-help p, .cmp-step span { font-size: 13px; line-height: 1.65; font-weight: 400; margin: 0 0 16px; }
    .cmp-step { display: flex; gap: 14px; margin-bottom: 18px; align-items: flex-start; }
    .cmp-step b {
      font-weight: 800; font-size: 12px; color: #000; background: #fff; border-radius: 50%;
      width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 1px;
    }
    .cmp-help-foot { margin-top: 28px !important; opacity: .45; }

    /* Held up: telemetry, help and volume fade in. Hanging: only the word. */
    .cmp-chrome { position: absolute; z-index: 2; opacity: 1; transition: opacity .4s ease; }
    html.cmp-hanging .cmp-chrome { opacity: 0; pointer-events: none; }
    .cmp-top {
      top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 10px;
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .cmp-help:is(.active) ~ .cmp-top, .cmp-help:is(.active) ~ .cmp-vol { color: #fff; }
    .cmp-sys {
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; line-height: 1.6;
      letter-spacing: .04em; opacity: .55; text-transform: uppercase; font-variant-numeric: tabular-nums;
    }
    .cmp-sys div { white-space: nowrap; }
    .cmp-dot {
      display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
      margin-right: 5px; vertical-align: middle; animation: cmp-blink 2s ease-in-out infinite;
    }
    @keyframes cmp-blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .cmp-icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid currentColor; padding: 0;
      background: transparent; color: inherit; display: flex; align-items: center; justify-content: center;
    }
    .cmp-icon-btn svg, .cmp-vol-icon svg { width: 20px; height: 20px; display: block; }
    .cmp-icon-btn:active { transform: scale(.92); }

    /* Volume: the mockup's dock, stood on end down the right edge. */
    .cmp-vol {
      right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 6px;
    }
    .cmp-vol-slider {
      -webkit-appearance: none; appearance: none; writing-mode: vertical-lr; direction: rtl;
      width: 22px; height: min(42vh, 280px); margin: 0; background: transparent; color: inherit;
    }
    .cmp-vol-slider::-webkit-slider-runnable-track {
      width: 4px; border-radius: 0;
      background: linear-gradient(to top, currentColor 0%, currentColor var(--fill, 50%),
        color-mix(in srgb, currentColor 35%, transparent) var(--fill, 50%), color-mix(in srgb, currentColor 35%, transparent) 100%);
    }
    .cmp-vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; margin-left: -7px; border-radius: 50%;
      background: currentColor; border: none;
    }
    .cmp-vol-slider:active::-webkit-slider-thumb { transform: scale(1.2); }

    /* The hidden debug hold: top-left as the screen reads. */
    .cmp-hotspot { position: absolute; top: 0; left: 0; width: 80px; height: 80px; z-index: 3; }

    @media (prefers-reduced-motion: reduce) {
      .cmp-mark, .cmp-idle-word, .cmp-word-text, .cmp-dot { animation: none; }
      body, #companion, .cmp-view, .cmp-chrome { transition: none; }
    }

    /* The debug readouts stay hidden until the corner hold, in the app or not. */
    html:not(.debug) #status { display: none; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e74c3c; margin-right: 4px; }
    .dot.ok { background: #2ecc71; }
  </style>
</head>
<body>
  <div id="flash"></div>
  <div id="videoOverlay"><video playsinline></video></div>
  <div id="imageOverlay"><img alt=""></div>
  <!-- Keeps iOS awake where the Wake Lock API is unavailable (plain http).
       Muted, so it never claims the audio session. See keepAwake() in client.js. -->
  <video id="keepAwake" src="assets/keepawake.mp4" muted loop playsinline
    style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;left:0"></video>
  <div id="stage">
    <div id="page"></div>
    <div id="companion"></div>
    <div id="joinScreen">
      <div id="label" class="page-hint"></div>
      <div class="page-title">DIM MACHINE</div>
      <button id="join">Join Show</button>
      <div id="loading" class="page-hint" style="display:none">loading assets…</div>
    </div>
    </div>
  </div>
  <div id="status">
    <span><span class="dot" id="connDot"></span><span id="connText">connecting</span></span>
    <span id="stateName"></span>
    <span>gesture <b id="gesture">–</b></span>
    <span>awake <b id="awake">–</b></span>
    <span>link <b id="link">–</b></span>
    <!-- Standing in for BLE: the handset reports which room it is in, so one
         person can walk the real building and the show follows them. -->
    <span>room <select id="roomPick" style="background:#14141f;color:#e7e9ee;border:1px solid #2a2a38;
      border-radius:4px;font:inherit;padding:1px 4px"><option value="">outside</option></select></span>
  </div>
  <script type="module" src="client.js"></script>
</body>
</html>
