<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>DIM Machine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0b0b10; color: #e8e8f0;
      display: flex; flex-direction: column;
      -webkit-user-select: none; user-select: none;
    }
    #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
    #join {
      font-size: 22px; padding: 20px 48px; border-radius: 999px; border: none;
      background: #6c5ce7; color: white; font-weight: 600;
    }
    #join:disabled { opacity: 0.5; }
    #stateName { font-size: 42px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
    #label { font-size: 15px; color: #9a9ab0; }
    #status {
      padding: 10px 14px; font-size: 12px; color: #8888a0;
      display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
      border-top: 1px solid #1d1d28; font-variant-numeric: tabular-nums;
    }
    #flash {
      position: fixed; inset: 0; background: white; opacity: 0;
      pointer-events: none;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e74c3c; margin-right: 5px; vertical-align: baseline; }
    .dot.ok { background: #2ecc71; }
  </style>
</head>
<body>
  <div id="flash"></div>
  <div id="stage">
    <div id="label"></div>
    <div id="stateName">DIM MACHINE</div>
    <button id="join">Join Show</button>
    <div id="loading" style="display:none; color:#9a9ab0">loading assets…</div>
  </div>
  <div id="status">
    <span><span class="dot" id="connDot"></span><span id="connText">connecting</span></span>
    <span>offset <b id="offset">–</b></span>
    <span>rtt <b id="rtt">–</b></span>
    <span>jitter <b id="jitter">–</b></span>
    <span>last cue drift <b id="drift">–</b></span>
  </div>
  <script src="client.js"></script>
</body>
</html>
