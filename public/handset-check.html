<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DIM handset check</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0c10; color: #e7e9ee;
         font: 15px/1.5 ui-monospace, Menlo, monospace; padding: 14px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #8b93a3; font-size: 12px; margin-bottom: 12px; }
  button { font: inherit; background: #1e2532; color: #e7e9ee; border: 1px solid #3a4356;
           border-radius: 8px; padding: 14px 18px; width: 100%; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  td { padding: 6px 4px; border-bottom: 1px solid #1c212c; vertical-align: top; }
  td:first-child { color: #8b93a3; width: 46%; }
  .ok { color: #58d68d; } .warn { color: #f5b041; } .bad { color: #ec7063; }
  #note { color: #8b93a3; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<h1>DIM handset check</h1>
<div class="sub" id="where"></div>
<button id="go">Tap to run checks</button>
<table id="out"></table>
<div id="note">
  After the checks run: press the power button to blank the screen for ~15s,
  then wake it. The <b>screen-off</b> rows fill in with what actually happened
  while it was dark — whether audio kept running and how hard the browser
  throttled timers. That part cannot be tested without doing it.
</div>

<!-- The same fallback the real client uses when there is no wake lock:
     a muted looping video claims enough of the media session to hold the
     screen on some devices. Testing the identical file matters. -->
<video id="keepAwake" src="assets/keepawake.mp4" muted loop playsinline
       style="width:1px;height:1px;opacity:0.01;position:fixed;bottom:0;right:0"></video>

<script>
// One page, no modules, no build — it must load on any phone that might be
// handed to a guest, which is the whole point of checking.
const results = {};       // name → { status, detail }
window.CHECK = { results, samples: [], vis: [], done: false };

const row = (name, status, detail) => {
  results[name] = { status, detail };
  render();
};
function render() {
  document.getElementById('out').innerHTML = Object.entries(results)
    .map(([k, v]) => `<tr><td>${k}</td><td class="${v.status}">${v.detail}</td></tr>`)
    .join('');
}

const host = location.host;
document.getElementById('where').textContent =
  `${location.href} — ${navigator.userAgent.match(/Android [^;)]+|iPhone OS [\d_]+/)?.[0] ?? 'desktop'}`;

// ------------------------------------------------------------- environment
function checkEnvironment() {
  row('browser', 'ok', (navigator.userAgent.match(/(Chrome|Firefox|Safari)\/[\d.]+/) ?? ['?'])[0]);
  row('screen', 'ok', `${screen.width}×${screen.height} @${devicePixelRatio}x`);
  // The venue serves plain http on a LAN IP, which is NOT a secure context —
  // localhost is. A pass here via USB forwarding says nothing about the venue.
  row('secure context', window.isSecureContext ? 'ok' : 'warn',
    window.isSecureContext
      ? `yes${location.hostname === 'localhost' ? ' (localhost — venue LAN IP will NOT be)' : ''}`
      : 'no — wakeLock and friends are absent, fallbacks in play');
  try {
    localStorage.setItem('dim-check', 'x');
    row('storage', localStorage.getItem('dim-check') === 'x' ? 'ok' : 'bad', 'localStorage round-trip');
    localStorage.removeItem('dim-check');
  } catch (e) { row('storage', 'bad', `localStorage: ${e.message}`); }
  row('vibration', 'vibrate' in navigator ? 'ok' : 'warn', 'vibrate' in navigator ? 'available' : 'absent');
}

// --------------------------------------------------------------- websocket
function checkWebSocket() {
  return new Promise((resolve) => {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${host}`);
    const rtts = [];
    const offsets = [];
    let opened = false;
    const timeout = setTimeout(() => {
      row('websocket', 'bad', opened ? 'opened but pings lost' : 'could not connect');
      try { ws.close(); } catch {}
      resolve(null);
    }, 6000);
    ws.onopen = () => { opened = true; ws.send(JSON.stringify({ type: 'ping', t0: Date.now() })); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type !== 'pong') return;
      const now = Date.now();
      rtts.push(now - m.t0);
      offsets.push(m.server - (m.t0 + now) / 2);
      if (rtts.length < 8) return ws.send(JSON.stringify({ type: 'ping', t0: Date.now() }));
      clearTimeout(timeout);
      ws.close();
      const sorted = [...rtts].sort((a, b) => a - b);
      const median = sorted[Math.floor(sorted.length / 2)];
      const jitter = Math.max(...offsets) - Math.min(...offsets);
      row('websocket', 'ok', `connected, 8 pings`);
      row('ws round-trip', median <= 60 ? 'ok' : median <= 150 ? 'warn' : 'bad',
        `median ${median}ms (min ${sorted[0]}, max ${sorted.at(-1)})`);
      row('clock stability', jitter <= 25 ? 'ok' : 'warn', `offset spread ${jitter.toFixed(1)}ms over 8 pings`);
      resolve({ median });
    };
    ws.onerror = () => {};
  });
}

// -------------------------------------------------------------------- audio
let ctx = null;
async function checkAudio() {
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    row('audio context', ctx.state === 'running' ? 'ok' : 'bad',
      `${ctx.state}, ${ctx.sampleRate}Hz, base latency ${((ctx.baseLatency ?? 0) * 1000).toFixed(1)}ms`);
  } catch (e) { return row('audio context', 'bad', e.message); }
  try {
    const res = await fetch('assets/click.wav');
    const buf = await ctx.decodeAudioData(await res.arrayBuffer());
    row('decode wav', 'ok', `${buf.duration.toFixed(2)}s decoded`);
  } catch (e) { row('decode wav', 'bad', e.message); }
  // A quiet tone the person should actually hear — and it keeps running into
  // the screen-off test, where its clock tells us whether audio survived.
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  gain.gain.value = 0.05;
  osc.frequency.value = 220;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  row('tone playing', 'ok', 'a quiet hum — if you cannot hear it, volume or routing is off');
}

// ---------------------------------------------------------------- wake lock
async function checkWakeLock() {
  if (navigator.wakeLock) {
    try {
      const lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => row('wake lock', 'warn', 'was granted, then released (normal on hide)'));
      row('wake lock', 'ok', 'granted — screen held awake the real way');
      return;
    } catch (e) { row('wake lock', 'warn', `refused: ${e.message}`); }
  } else {
    row('wake lock', window.isSecureContext ? 'warn' : 'bad',
      'API absent' + (window.isSecureContext ? '' : ' (needs a secure context — the venue http problem)'));
  }
  const video = document.getElementById('keepAwake');
  video.play()
    .then(() => row('keep-awake fallback', 'ok', 'muted looping video is playing'))
    .catch((e) => row('keep-awake fallback', 'bad', `video refused: ${e.message}`));
}

// ------------------------------------------------------------------ motion
function checkMotion() {
  let count = 0;
  const listener = () => { count += 1; };
  window.addEventListener('devicemotion', listener);
  setTimeout(() => {
    window.removeEventListener('devicemotion', listener);
    row('device motion', count > 0 ? 'ok' : 'warn',
      count > 0 ? `${count} events in 2s — shake gesture will work` : 'no events — shake gesture dead');
  }, 2000);
}

// ------------------------------------------------- screen-off / throttling
// Sample the wall clock and the audio clock together. While the screen is
// off, a throttled timer shows as a gap between wall-clock samples, and a
// suspended AudioContext shows as its clock freezing while the wall moves.
function startSampling() {
  setInterval(() => {
    window.CHECK.samples.push({ wall: Date.now(), audio: ctx ? ctx.currentTime : null, hidden: document.hidden });
    if (window.CHECK.samples.length > 600) window.CHECK.samples.shift();
  }, 500);
  document.addEventListener('visibilitychange', () => {
    window.CHECK.vis.push({ at: Date.now(), hidden: document.hidden });
    if (!document.hidden) reportScreenOff();
  });
}

function reportScreenOff() {
  const s = window.CHECK.samples;
  if (s.length < 4) return;
  let maxGap = 0;
  for (let i = 1; i < s.length; i++) maxGap = Math.max(maxGap, s[i].wall - s[i - 1].wall);
  const hiddenSpan = window.CHECK.vis.length >= 2
    ? window.CHECK.vis.at(-1).at - window.CHECK.vis.at(-2).at : 0;
  row('screen-off: timers', maxGap < 2000 ? 'ok' : maxGap < 15000 ? 'warn' : 'bad',
    `worst timer gap ${(maxGap / 1000).toFixed(1)}s across ${(hiddenSpan / 1000).toFixed(0)}s hidden`);
  // Did the audio clock keep pace with the wall clock while hidden?
  const hidden = s.filter((x) => x.hidden && x.audio != null);
  if (hidden.length >= 2) {
    const wallMoved = (hidden.at(-1).wall - hidden[0].wall) / 1000;
    const audioMoved = hidden.at(-1).audio - hidden[0].audio;
    const kept = wallMoved > 0 ? audioMoved / wallMoved : 1;
    row('screen-off: audio', kept > 0.9 ? 'ok' : kept > 0.1 ? 'warn' : 'bad',
      `audio clock ran ${(kept * 100).toFixed(0)}% of real time while dark`
      + (kept > 0.9 ? ' — sound survives the pocket' : ' — audio suspends when the screen sleeps'));
  } else {
    row('screen-off: audio', 'warn', 'no samples while hidden — timers were fully frozen');
  }
  row('screen-off: recovery', ctx?.state === 'running' ? 'ok' : 'warn',
    `audio context "${ctx?.state}" after wake (the client resyncs on wake either way)`);
  window.CHECK.done = true;
}

document.getElementById('go').addEventListener('click', async () => {
  document.getElementById('go').disabled = true;
  document.getElementById('go').textContent = 'Running…';
  checkEnvironment();
  checkMotion();
  await checkAudio();
  await checkWakeLock();
  await checkWebSocket();
  startSampling();
  document.getElementById('go').textContent = 'Checks running — now blank the screen ~15s';
});
</script>
</body>
</html>
