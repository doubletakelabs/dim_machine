<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIM Operator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #101018; color: #e8e8f0; padding: 20px; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 18px; margin-bottom: 12px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #8888a0; margin: 22px 0 8px; }
    button {
      background: #23233a; color: #e8e8f0; border: 1px solid #34345a; border-radius: 8px;
      padding: 9px 16px; font-size: 14px; margin: 3px; cursor: pointer;
    }
    button:hover { background: #2e2e4d; }
    button.primary { background: #6c5ce7; border-color: #6c5ce7; }
    button.danger { background: #3a1e26; border-color: #7a2e3d; }
    button.small { padding: 4px 10px; font-size: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid #1e1e2e; }
    th { color: #8888a0; font-weight: 500; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e74c3c; margin-right: 6px; }
    .dot.ok { background: #2ecc71; }
    #log { background: #0b0b12; border: 1px solid #1e1e2e; border-radius: 8px; padding: 10px; height: 200px; overflow-y: auto; font: 12px/1.5 ui-monospace, monospace; color: #9a9ab0; }
    select, input[type=text] { background: #23233a; color: #e8e8f0; border: 1px solid #34345a; border-radius: 8px; padding: 8px; font-size: 14px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .warn { color: #f39c12; }
    .pill { background: #23233a; border-radius: 999px; padding: 4px 12px; font-size: 12px; color: #b8b8cc; }
    .pill b { color: #6c5ce7; }
    .state { color: #6c5ce7; font-weight: 600; }
    .room-id { color: #2ecc71; font-size: 12px; }
  </style>
</head>
<body>
  <h1>DIM Machine — Operator</h1>
  <a href="/author.html" style="float:right;color:#8888a0;font-size:13px;text-decoration:none">Author →</a>

  <h2>Show</h2>
  <div class="row">
    <select id="showFile"></select>
    <button onclick="send({type:'loadShow', file: $('showFile').value})">Load</button>
    <button class="primary" id="startBtn" onclick="send({type:'startShow'})">▶ Start</button>
    <button class="danger" onclick="send({type:'stopShow'})">■ Stop</button>
    <span class="pill" id="showInfo">no show loaded</span>
    <span class="pill" id="globalsInfo" style="display:none"></span>
  </div>

  <div id="roomsSection" style="display:none">
    <h2>Rooms</h2>
    <div class="row" id="moveAllRow" style="margin-bottom:10px">
      <span style="color:#8888a0;font-size:13px">Move everyone</span>
      <select id="moveAllFrom" style="font-size:13px">
        <option value="">from any room</option>
      </select>
      <span style="color:#8888a0">→</span>
      <select id="moveAllTo" style="font-size:13px"></select>
      <button class="primary" onclick="moveAllToRoom()">Move all</button>
    </div>
    <table>
      <thead><tr><th>Room</th><th>State</th><th>Members</th><th>Force state</th><th>Events</th></tr></thead>
      <tbody id="rooms"></tbody>
    </table>
  </div>

  <h2>Events → <select id="target" style="font-size:13px"><option value="all">All phones</option></select></h2>
  <p class="pill" id="eventContext" style="margin-bottom:8px">Select a target to see available events</p>
  <div id="eventButtons" class="row"></div>
  <div class="row">
    <input type="text" id="customEvent" placeholder="custom event name" />
    <button onclick="if($('customEvent').value) send({type:'sendEvent', event:$('customEvent').value, target:$('target').value})">Send</button>
  </div>

  <h2>Test cues</h2>
  <div class="row">
    <button class="primary" onclick="pushCue({kind:'synctest', leadTimeMs:2000})">⚡ Sync test (flash + click)</button>
    <button onclick="pushCue({kind:'audio', assetId:'chime.wav', leadTimeMs:2000})">Chime</button>
    <button onclick="pushCue({kind:'stopAudio', assetId:'*', fadeMs:800, leadTimeMs:0})">■ Stop all audio</button>
  </div>

  <h2>Devices <span class="pill" id="hiddenOffline" style="display:none"></span></h2>
  <div class="row" id="offlineActions" style="display:none">
    <button onclick="clearOffline()">Clear hidden offline phones</button>
  </div>
  <table>
    <thead><tr><th></th><th>Device</th><th>Room</th><th>State</th><th>Page</th><th>Role</th><th>Offset</th><th>Drift</th><th>Status</th></tr></thead>
    <tbody id="devices"></tbody>
  </table>

  <h2>Log</h2>
  <div id="log"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let ws;
    let roles = [];
    let roomDefs = [];
    let roomMode = false;
    let lastRoster = null;
    let lastRoomDefsKey = '';
    let lastRoomsKey = '';

    function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
    function pushCue(cue) { send({ type: 'pushCue', cue, target: $('target').value }); }
    function setRole(token, role) { send({ type: 'setRole', token, role }); }
    function assignZone(token, roomId) { send({ type: 'assignZone', token, roomId: roomId || null }); }
    function forceRoomState(roomId) {
      const sel = document.querySelector(`select[data-force-room="${roomId}"]`);
      if (!sel?.value) return;
      send({ type: 'forceRoomState', roomId, state: sel.value });
    }
    function moveAllToRoom() {
      const roomId = $('moveAllTo').value;
      if (!roomId) return;
      send({ type: 'moveAllToRoom', roomId, fromRoomId: $('moveAllFrom').value || null });
    }
    function startRoom(roomId) { send({ type: 'startRoom', roomId }); }
    function sendRoomEvent(roomId, ev) { send({ type: 'sendEvent', event: ev, target: `room:${roomId}` }); }
    function clearOffline() { send({ type: 'clearOfflinePhones' }); }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}`);
      ws.onopen = () => send({ type: 'hello', role: 'operator' });
      ws.onclose = () => setTimeout(connect, 1000);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'roster') renderRoster(msg);
        if (msg.type === 'log') {
          const line = document.createElement('div');
          line.textContent = `${new Date(msg.at).toLocaleTimeString()}  ${msg.line}`;
          $('log').appendChild(line);
          while ($('log').childElementCount > 400) $('log').firstChild.remove();
          $('log').scrollTop = $('log').scrollHeight;
        }
      };
    }

    function eventsForTarget(msg) {
      const target = $('target').value;
      const s = msg.show;
      if (roomMode && target.startsWith('room:')) {
        const roomId = target.slice(5);
        const room = (s.rooms ?? []).find((r) => r.id === roomId);
        if (!room) return { events: [], context: roomId };
        if (!room.started) return { events: [], context: `${room.name} · not started` };
        return {
          events: room.availableEvents ?? [],
          context: `${room.name} · ${room.state}`,
        };
      }
      if (roomMode && target === 'all') {
        const started = (s.rooms ?? []).filter((r) => r.started);
        if (started.length === 1) {
          const room = started[0];
          return {
            events: room.availableEvents ?? [],
            context: `${room.name} · ${room.state} (only started room)`,
          };
        }
        return { events: [], context: 'Select a room to see its current events' };
      }
      const user = msg.users.find((u) => u.token === target);
      if (user) {
        if (roomMode && user.zoneId) {
          const room = (s.rooms ?? []).find((r) => r.id === user.zoneId);
          return {
            events: room?.availableEvents ?? user.availableEvents ?? [],
            context: room ? `${room.name} · ${room.state}` : user.state ?? user.label,
          };
        }
        return {
          events: user.availableEvents ?? [],
          context: user.state ?? user.label,
        };
      }
      if (!roomMode && target === 'all') {
        const u = msg.users.find((u) => u.connected) ?? msg.users[0];
        return {
          events: u?.availableEvents ?? [],
          context: u ? `all phones · ${u.state ?? '?'}` : 'no phones connected',
        };
      }
      return { events: [], context: 'Select a target' };
    }

    function renderEventButtons(msg) {
      const { events, context } = eventsForTarget(msg);
      $('eventContext').textContent = context;
      $('eventButtons').innerHTML = '';
      if (!events.length) {
        const hint = document.createElement('span');
        hint.className = 'warn';
        hint.textContent = 'No operator events from this state';
        $('eventButtons').appendChild(hint);
        return;
      }
      for (const ev of events) {
        const b = document.createElement('button');
        b.textContent = ev;
        b.onclick = () => send({ type: 'sendEvent', event: ev, target: $('target').value });
        $('eventButtons').appendChild(b);
      }
    }

    function keepSelection(sel, options, first) {
      const current = sel.value;
      sel.innerHTML = (first ?? '') + options;
      if ([...sel.options].some((o) => o.value === current)) sel.value = current;
    }

    function renderRoster(msg) {
      lastRoster = msg;
      keepSelection($('showFile'), (msg.shows ?? []).map((f) => `<option value="${f}">${f}</option>`).join(''));
      const s = msg.show ?? {};
      roomMode = !!s.roomMode;
      roomDefs = s.roomDefs ?? [];
      $('roomsSection').style.display = roomMode ? '' : 'none';
      if (!roomMode) lastRoomDefsKey = '';
      const roomDefsKey = roomDefs.map((r) => r.id).join(',');
      if (roomMode && roomDefsKey !== lastRoomDefsKey) {
        lastRoomDefsKey = roomDefsKey;
        const roomOpts = roomDefs.map((r) => `<option value="${r.id}">${r.name}</option>`).join('');
        keepSelection($('moveAllTo'), roomOpts);
        keepSelection($('moveAllFrom'), roomOpts, '<option value="">from any room</option>');
      }

      $('showInfo').innerHTML = s.loaded
        ? `<b>${s.name}</b> · contract v${s.contractVersion}${roomMode ? ' · <b>rooms</b>' : ''} · ${s.running ? '<b>RUNNING</b>' : 'loaded'}`
        : 'no show loaded';
      const globals = Object.entries(s.globals ?? {});
      $('globalsInfo').style.display = globals.length ? '' : 'none';
      $('globalsInfo').innerHTML = globals.map(([k, v]) => `${k} = <b>${JSON.stringify(v)}</b>`).join(' · ');
      roles = s.roles ?? [];

      const hidden = msg.hiddenOfflineCount ?? 0;
      $('hiddenOffline').style.display = hidden ? '' : 'none';
      $('hiddenOffline').textContent = hidden ? `${hidden} offline >60s (hidden)` : '';
      $('offlineActions').style.display = hidden ? '' : 'none';

      // event target: all phones, each device, each room
      let targetOpts = '<option value="all">' + (roomMode ? 'All started rooms' : 'All phones') + '</option>';
      if (roomMode) {
        for (const r of s.rooms ?? [])
          targetOpts += `<option value="room:${r.id}">Room: ${r.name}${r.state ? ` (${r.state})` : ''}</option>`;
      }
      targetOpts += msg.users.map((u) => `<option value="${u.token}">${u.label}${u.state ? ` · ${u.state}` : ''}</option>`).join('');
      keepSelection($('target'), targetOpts);

      renderEventButtons(msg);

      if (roomMode) {
        const roomsKey = (s.rooms ?? []).map((r) =>
          `${r.id}:${r.state}:${r.members}:${(r.availableEvents ?? []).join(',')}:${(r.stateNames ?? []).join(',')}`
        ).join('|');
        if (roomsKey !== lastRoomsKey) {
          lastRoomsKey = roomsKey;
          const savedForce = {};
          document.querySelectorAll('select[data-force-room]').forEach((sel) => {
            savedForce[sel.dataset.forceRoom] = sel.value;
          });
        $('rooms').innerHTML = (s.rooms ?? []).map((r) => {
          const evBtns = (r.availableEvents ?? []).map((ev) =>
            `<button class="small" onclick="sendRoomEvent('${r.id}','${ev}')">${ev}</button>`
          ).join('');
          const stateOpts = (r.stateNames ?? []).map((st) =>
            `<option value="${st}" ${r.state === st ? 'selected' : ''}>${st}</option>`
          ).join('');
          const forceState = (r.stateNames ?? []).length
            ? `<select data-force-room="${r.id}" class="small" style="font-size:12px;padding:4px">${stateOpts}</select>
               <button class="small" onclick="forceRoomState('${r.id}')">Set</button>`
            : '–';
          return `<tr>
            <td><b>${r.name}</b> <span class="room-id">${r.id}</span></td>
            <td class="state">${r.started ? (r.state ?? '…') : '<span class="warn">idle</span>'}</td>
            <td>${r.members}</td>
            <td>${forceState}</td>
            <td>
              ${!r.started && r.startOn === 'operatorOnly' ? `<button class="small primary" onclick="startRoom('${r.id}')">Start room</button>` : ''}
              ${evBtns}
            </td>
          </tr>`;
        }).join('');
          document.querySelectorAll('select[data-force-room]').forEach((sel) => {
            const saved = savedForce[sel.dataset.forceRoom];
            if (saved && [...sel.options].some((o) => o.value === saved)) sel.value = saved;
          });
        }
      } else lastRoomsKey = '';

      const roomOptions = roomDefs.map((r) => `<option value="${r.id}">${r.name}</option>`).join('');

      $('devices').innerHTML = msg.users.map((u) => {
        const t = u.telemetry;
        const zoneSel = roomMode
          ? `<select onchange="assignZone('${u.token}', this.value)">` +
            `<option value="">–</option>` +
            roomDefs.map((r) => `<option value="${r.id}" ${u.zoneId === r.id ? 'selected' : ''}>${r.name}</option>`).join('') +
            `</select>`
          : '–';
        const roleSel = `<select onchange="setRole('${u.token}', this.value)">` +
          `<option value="">–</option>` +
          roles.map((r) => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r}</option>`).join('') +
          `</select>`;
        return `<tr>
          <td><span class="dot ${u.connected ? 'ok' : ''}"></span></td>
          <td>${u.label}</td>
          <td>${zoneSel}</td>
          <td class="state">${u.state ?? '–'}</td>
          <td>${u.page ?? '–'}</td>
          <td>${roleSel}</td>
          <td>${t ? t.offset + 'ms' : '–'}</td>
          <td>${t?.lastCueDriftMs != null ? t.lastCueDriftMs + 'ms' : '–'}</td>
          <td>${u.connected ? 'online' : `<span class="warn">offline ${(u.disconnectedForMs / 1000).toFixed(0)}s</span>`}</td>
        </tr>`;
      }).join('');
    }

    connect();
    $('target').addEventListener('change', () => { if (lastRoster) renderEventButtons(lastRoster); });
  </script>
</body>
</html>
